# Zentox Aesthetics CRM — nginx reverse proxy
# Deploy this on your Hostinger VPS
# Replace zentoxaesthetics.com with your actual domain

events {
    worker_connections 1024;
}

http {
    # Redirect all HTTP to HTTPS (required for HIPAA)
    server {
        listen 80;
        server_name crm.zentoxaesthetics.com api.zentoxaesthetics.com;
        return 301 https://$host$request_uri;
    }

    # Streamlit frontend
    server {
        listen 443 ssl http2;
        server_name crm.zentoxaesthetics.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # HIPAA security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        location / {
            proxy_pass http://frontend:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }

    # FastAPI backend
    server {
        listen 443 ssl http2;
        server_name api.zentoxaesthetics.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;

        # Rate limiting (HIPAA: prevent brute-force)
        limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
        limit_req zone=api burst=10 nodelay;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
